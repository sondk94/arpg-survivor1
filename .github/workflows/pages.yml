# Tự kiểm tra và đưa game lên GitHub Pages mỗi khi có code mới trên nhánh main.
# Cần bật một lần: Settings → Pages → Source: "GitHub Actions".
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kiểm tra công thức và hệ thống
        run: node tools/test.mjs
      - name: Gom các file cần cho game
        run: |
          mkdir _site
          cp -r index.html css src data _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
